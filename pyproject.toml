[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentforge-ai"
version = "0.1.0"
description = "Import long videos, cut and merge clips by topic, generate SEO posts and blog articles, and publish to social networks and blogs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "markdown>=3.5",
  "requests>=2.31",
  "typer>=0.12",
  "yt-dlp[default]>=2025.10.22",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
facetrack = ["opencv-python-headless>=4.8,<5"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "faster-whisper>=1.0", "opencv-python-headless>=4.8,<5", "google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
youtube = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
contentforge = "contentforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
